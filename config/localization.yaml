# NDT against the PCD map; wheel odom TF supplies prediction.
/**:
  ros__parameters:
    base_frame_id: base_link
    borderline_seed_gate_min_seed_translation_m: 1.0
    borderline_seed_gate_score_threshold: 5.25
    continuous_time_cloud_stamp_reference: start
    continuous_time_deskew_mode: relative_motion
    continuous_time_deskew_reference_time_sec: 0.0
    continuous_time_pose_history_duration_sec: 2.0
    enable_borderline_seed_rejection_gate: true
    enable_debug: false
    enable_local_map_crop: true
    enable_localizability_guard: false
    enable_map_odom_tf: true
    enable_open_loop_strict_score_threshold: false
    enable_registration_localizability_diagnostics: false
    enable_reinitialization_request_latch: true
    enable_reinitialization_request_output: true
    enable_scan_voxel_filter: false
    enable_seed_correction_guard: false
    enable_timer_publishing: true
    global_frame_id: map
    imu_preintegration_use_base_frame_transform: false
    initial_pose_qw: 1.0
    initial_pose_qx: 0.0
    initial_pose_qy: 0.0
    initial_pose_qz: 0.0
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_z: 0.0
    local_map_min_points: 100
    local_map_radius: 150.0
    local_map_update_distance: 10.0
    localizability_min_xy_eigen_ratio: 0.05
    map_path: /home/steno/maps/map_corridor.pcd
    max_twist_prediction_dt: 0.5
    ndt_max_iterations: 35
    ndt_num_threads: 4
    ndt_resolution: 1.0
    ndt_step_size: 0.1
    odom_frame_id: odom
    open_loop_strict_min_accepted_gap_sec: 15.0
    open_loop_strict_min_seed_translation_m: 100.0
    open_loop_strict_score_threshold: 5.25
    pose_publish_frequency: 10.0
    predict_pose_from_previous_delta: true
    publish_bridge_pose_when_lost: false
    registration_method: NDT_OMP
    reinitialization_trigger_fitness_explosion_threshold: 1000.0
    reinitialization_trigger_gap_scale_sec: 30.0
    reinitialization_trigger_reject_streak_scale: 200.0
    reinitialization_trigger_seed_translation_scale_m: 100.0
    reinitialization_trigger_threshold: 0.95
    reject_above_score_threshold: true
    scan_max_range: 100.0
    scan_min_range: 1.0
    scan_period: 0.1
    scan_time_range_max_duration_ratio: 2.0
    score_threshold: 6.0
    seed_correction_guard_exact_start_translation_m: 0.1
    seed_correction_guard_release_rejections: 30
    seed_correction_guard_translation_m: 0.3
    seed_correction_guard_warmup_accepts: 5
    seed_correction_guard_yaw_deg: 15.0
    set_initial_pose: false
    transform_epsilon: 0.01
    twist_prediction_use_angular_velocity: false
    use_continuous_time_deskew: false
    use_imu: false
    use_imu_preintegration: false
    use_odom: false
    use_odom_tf_prediction: true
    use_pcd_map: true
    use_twist_prediction: false
    voxel_leaf_size: 0.2
